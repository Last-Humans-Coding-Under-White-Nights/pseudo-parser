name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build & Test (Linux x86_64 - apt.llvm.org)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pseudo-parser
        uses: actions/checkout@v4

      - name: Install dependencies & apt.llvm.org main toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common ninja-build cmake git
          # Run official llvm.sh to install main development toolchain (version 24)
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 24 all

      - name: Checkout upstream llvm-project headers (matching clangd revision)
        run: |
          CLANGD_BIN=$(which clangd-24 || which clangd)
          echo "Inspecting version from $CLANGD_BIN:"
          $CLANGD_BIN --version
          COMMIT_HASH=$($CLANGD_BIN --version | grep -oE '[0-9a-f]{40}|[0-9a-f]{12}' | head -n 1 || true)
          echo "Matching LLVM revision: $COMMIT_HASH"

          git clone --filter=blob:none --no-checkout https://github.com/llvm/llvm-project.git llvm-project
          git -C llvm-project sparse-checkout set clang-tools-extra
          if [ -n "$COMMIT_HASH" ]; then
            git -C llvm-project checkout "$COMMIT_HASH" || git -C llvm-project checkout main
          else
            git -C llvm-project checkout main
          fi

      - name: Configure pseudo-parser
        run: |
          LLVM_CONFIG="llvm-config-24"
          if ! command -v $LLVM_CONFIG &>/dev/null; then
            LLVM_CONFIG="llvm-config"
          fi
          LLVM_PREFIX=$($LLVM_CONFIG --prefix)
          LLVM_DIR=$($LLVM_CONFIG --cmakedir)
          echo "Using LLVM prefix: $LLVM_PREFIX"
          echo "Using LLVM CMake dir: $LLVM_DIR"
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-24 \
            -DCMAKE_CXX_COMPILER=clang++-24 \
            -DCMAKE_PREFIX_PATH="$LLVM_PREFIX" \
            -DLLVM_DIR="$LLVM_DIR" \
            -DClang_DIR="$LLVM_PREFIX/lib/cmake/clang" \
            -DCLANGD_INCLUDE_DIRS="$PWD/llvm-project/clang-tools-extra/clangd" \
            -DPSEUDO_ENABLE_TESTS=ON

      - name: Build pseudo-parser feature module and tools
        run: |
          ninja -C build clangd_pseudo pseudo-tool
          ninja -C build ClangPseudoTests || true

      - name: Run unit tests (if available)
        run: |
          if [ -f ./build/unittests/ClangPseudoTests ]; then
            ./build/unittests/ClangPseudoTests
          else
            echo "Skipping ClangPseudoTests (LLVMTestingSupport not in distribution package)"
          fi

      - name: Test loading feature module into official clangd (-load) and LSP diagnostics
        shell: bash
        run: |
          PLUGIN_PATH=$(find build -name "*clangd_pseudo.so" | head -n 1)
          echo "Found plugin at: $PLUGIN_PATH"
          CLANGD_BIN=$(which clangd-24 || which clangd)
          echo "Using clangd at: $CLANGD_BIN"
          python3 test_lsp.py "$PLUGIN_PATH" "$CLANGD_BIN"

      - name: Verify plugin dynamic dependencies
        run: |
          PLUGIN_PATH=$(find build -name "*clangd_pseudo.so" | head -n 1)
          echo "Inspecting ELF dynamic dependencies for $PLUGIN_PATH:"
          readelf -d "$PLUGIN_PATH" | grep NEEDED || true
          if readelf -d "$PLUGIN_PATH" | grep NEEDED | grep -E 'libLLVM|libclang-cpp'; then
            echo "ERROR: Plugin contains unwanted shared library dependency!"
            exit 1
          fi
          echo "✓ Plugin has no DT_NEEDED dependencies on libLLVM or libclang-cpp"

      - name: Package Linux artifact
        run: |
          mkdir -p dist
          find build -name "*clangd_pseudo.so" -exec cp {} dist/libclangd_pseudo.so \;
          tar czf clangd-pseudo-linux-x86_64.tar.gz -C dist .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: clangd-pseudo-linux-x86_64
          path: clangd-pseudo-linux-x86_64.tar.gz

  build-macos:
    name: Build & Test (macOS ARM64)
    runs-on: macos-latest
    steps:
      - name: Checkout pseudo-parser
        uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja || true

      - name: Restore Clangd cache
        id: cache-clangd
        uses: actions/cache/restore@v4
        with:
          path: |
            llvm-build
            llvm-project
          key: clangd-macos-arm64-v1
          restore-keys: |
            clangd-macos-arm64-

      - name: Checkout upstream llvm-project
        if: steps.cache-clangd.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 https://github.com/llvm/llvm-project.git llvm-project
          git -C llvm-project sparse-checkout set llvm clang clang-tools-extra cmake third-party libc
          git -C llvm-project checkout

      - name: Build Clangd from main
        if: steps.cache-clangd.outputs.cache-hit != 'true'
        run: |
          cmake -B llvm-build -S llvm-project/llvm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;clang-tools-extra" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DCLANG_PLUGIN_SUPPORT=ON \
            -DLLVM_ENABLE_PLUGINS=ON \
            -DLLVM_OPTIMIZED_TABLEGEN=ON \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_TOOL_CLANG_CHECK_BUILD=OFF \
            -DCLANG_TOOL_CLANG_FORMAT_BUILD=OFF
          ninja -C llvm-build clangd

      - name: Save Clangd cache
        if: steps.cache-clangd.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            llvm-build
            llvm-project
          key: clangd-macos-arm64-v1

      - name: Configure pseudo-parser
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/llvm-build" \
            -DLLVM_DIR="$PWD/llvm-build/lib/cmake/llvm" \
            -DClang_DIR="$PWD/llvm-build/lib/cmake/clang" \
            -DCLANGD_INCLUDE_DIRS="$PWD/llvm-project/clang-tools-extra/clangd" \
            -DPSEUDO_ENABLE_TESTS=ON

      - name: Build pseudo-parser feature module and tools
        run: |
          ninja -C build clangd_pseudo pseudo-tool
          ninja -C build ClangPseudoTests || true

      - name: Run unit tests (if available)
        run: |
          if [ -f ./build/unittests/ClangPseudoTests ]; then
            ./build/unittests/ClangPseudoTests
          else
            echo "Skipping ClangPseudoTests (LLVMTestingSupport not in distribution package)"
          fi

      - name: Test loading feature module into clangd (-load) and LSP diagnostics
        shell: bash
        run: |
          PLUGIN_PATH=$(find build \( -name "*clangd_pseudo.dylib" -o -name "*clangd_pseudo.so" \) | head -n 1)
          echo "Found plugin at: $PLUGIN_PATH"
          CLANGD_BIN="$PWD/llvm-build/bin/clangd"
          chmod +x "$CLANGD_BIN" || true
          echo "Using clangd at: $CLANGD_BIN"
          python3 test_lsp.py "$PLUGIN_PATH" "$CLANGD_BIN"

      - name: Verify plugin dynamic dependencies
        run: |
          PLUGIN_PATH=$(find build \( -name "*clangd_pseudo.dylib" -o -name "*clangd_pseudo.so" \) | head -n 1)
          if [ -z "$PLUGIN_PATH" ]; then
            echo "ERROR: Plugin not found!"
            exit 1
          fi
          echo "Inspecting Mach-O dynamic dependencies for $PLUGIN_PATH:"
          otool -L "$PLUGIN_PATH"
          if otool -L "$PLUGIN_PATH" | grep -E 'libLLVM|libclang-cpp'; then
            echo "ERROR: Plugin contains unwanted shared library dependency!"
            exit 1
          fi
          echo "✓ Plugin has no dynamic dependencies on libLLVM or libclang-cpp"

      - name: Package macOS artifact
        run: |
          mkdir -p dist
          find build \( -name "*clangd_pseudo.dylib" -o -name "*clangd_pseudo.so" \) -exec cp {} dist/libclangd_pseudo.dylib \;
          tar czf clangd-pseudo-macos.tar.gz -C dist .

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: clangd-pseudo-macos
          path: clangd-pseudo-macos.tar.gz

  build-windows:
    name: Build & Test (Windows x86_64)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows]')
    runs-on: windows-latest
    steps:
      - name: Checkout pseudo-parser
        uses: actions/checkout@v4

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Checkout upstream llvm-project
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 https://github.com/llvm/llvm-project.git llvm-project
          git -C llvm-project sparse-checkout set llvm clang clang-tools-extra cmake third-party libc
          git -C llvm-project checkout

      - name: Restore Clangd cache
        id: cache-clangd
        uses: actions/cache/restore@v4
        with:
          path: llvm-build
          key: clangd-win-plugins-v3
          restore-keys: |
            clangd-win-plugins-

      - name: Build Clangd with plugin symbol exports (LLVM_EXPORT_SYMBOLS_FOR_PLUGINS=ON)
        if: steps.cache-clangd.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cmake -B llvm-build -S llvm-project/llvm -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DLLVM_ENABLE_PROJECTS="clang;clang-tools-extra" ^
            -DLLVM_TARGETS_TO_BUILD="X86" ^
            -DLLVM_ENABLE_PLUGINS=OFF ^
            -DLLVM_EXPORT_SYMBOLS_FOR_PLUGINS=ON ^
            -DCLANG_PLUGIN_SUPPORT=ON ^
            -DLLVM_OPTIMIZED_TABLEGEN=ON ^
            -DLLVM_ENABLE_ASSERTIONS=OFF ^
            -DLLVM_BUILD_TOOLS=OFF ^
            -DLLVM_INCLUDE_TESTS=OFF ^
            -DLLVM_INCLUDE_BENCHMARKS=OFF ^
            -DLLVM_INCLUDE_EXAMPLES=OFF ^
            -DCLANG_INCLUDE_TESTS=OFF ^
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF ^
            -DCLANG_ENABLE_ARCMT=OFF ^
            -DCLANG_TOOL_CLANG_CHECK_BUILD=OFF ^
            -DCLANG_TOOL_CLANG_FORMAT_BUILD=OFF
          ninja -C llvm-build clangd

      - name: Save Clangd cache
        if: steps.cache-clangd.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: llvm-build
          key: clangd-win-plugins-v3

      - name: Configure pseudo-parser
        shell: cmd
        run: |
          cmake -B build -S . -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%CD%/llvm-build" ^
            -DLLVM_DIR="%CD%/llvm-build/lib/cmake/llvm" ^
            -DClang_DIR="%CD%/llvm-build/lib/cmake/clang" ^
            -DCLANGD_INCLUDE_DIRS="%CD%/llvm-project/clang-tools-extra/clangd" ^
            -DPSEUDO_ENABLE_TESTS=OFF

      - name: Build pseudo-parser feature module and tools
        shell: cmd
        run: |
          ninja -C build clangd_pseudo pseudo-tool

      - name: Test feature module LSP diagnostics with clangd (-load)
        shell: bash
        run: |
          PLUGIN_PATH=$(find build -name "*clangd_pseudo*.dll" | head -n 1)
          echo "Found plugin at: $PLUGIN_PATH"
          python3 test_lsp.py "$PLUGIN_PATH" llvm-build/bin/clangd.exe

      - name: Package Windows artifact
        shell: bash
        run: |
          mkdir -p dist
          find build -name "*clangd_pseudo.dll" -exec cp {} dist/ \;
          7z a clangd-pseudo-windows-x86_64.zip ./dist/*

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: clangd-pseudo-windows-x86_64
          path: clangd-pseudo-windows-x86_64.zip

  release:
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
      !cancelled() &&
      !contains(needs.*.result, 'failure')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release on GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          RELEASE_FILES=(artifacts/*.tar.gz artifacts/*.zip)
          if [ ${#RELEASE_FILES[@]} -eq 0 ]; then
            echo "No artifacts to release!"
            exit 1
          fi
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              "${RELEASE_FILES[@]}"
          else
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest \
              --target "${{ github.sha }}" \
              --title "latest" \
              --notes "Automated build of clangd pseudo-parser feature module" \
              --prerelease \
              "${RELEASE_FILES[@]}"
          fi
